services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hybrid-rag-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/database/faiss:/app/backend/database/faiss

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hybrid-rag-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hybrid-rag.rule=Host(`hybrid-rag.srv1967854.hstgr.cloud`)"
      - "traefik.http.routers.hybrid-rag.entrypoints=websecure"
      - "traefik.http.routers.hybrid-rag.tls.certresolver=letsencrypt"
      - "traefik.http.services.hybrid-rag.loadbalancer.server.port=8501"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8502:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
